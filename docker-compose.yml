services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rinconcito_del_sabor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rinconcito_del_sabor"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/rinconcito_del_sabor?schema=public
      SESSION_SECRET: local-development-secret-change-before-production
      APP_URL: http://localhost:3000
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  postgres_data:
